<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="mt-bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0E" />
      <stop offset="100%" stop-color="#16161B" />
    </linearGradient>
    <linearGradient id="amber-accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="cart-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-8" dy="0" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#mt-bg3)" />

  <!-- Background Storefront (dimmed) -->
  <rect x="50" y="40" width="700" height="670" rx="16" fill="#141417" stroke="#25252B" stroke-width="1" />
  <text x="80" y="85" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900">Manoj Traders Live Order Tracking</text>
  <text x="80" y="110" fill="#71717A" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">Order #MT-88492 • Cold-Chain Express Shipping</text>

  <!-- Step tracker -->
  <g transform="translate(80, 150)">
    <circle cx="20" cy="20" r="14" fill="#10B981" />
    <text x="20" y="24" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
    <text x="45" y="18" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Order Confirmed</text>
    <text x="45" y="32" fill="#71717A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Farm packing completed</text>

    <line x1="20" y1="38" x2="20" y2="78" stroke="#10B981" stroke-width="3" />

    <circle cx="20" cy="95" r="14" fill="#10B981" />
    <text x="20" y="99" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓</text>
    <text x="45" y="93" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Dispatched from Warehouse</text>
    <text x="45" y="107" fill="#71717A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Temperature regulated 4°C</text>

    <line x1="20" y1="113" x2="20" y2="153" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4 4" />

    <circle cx="20" cy="170" r="14" fill="#F59E0B" />
    <text x="20" y="175" fill="#09090B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">●</text>
    <text x="45" y="168" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800">Out for 24-Hr Doorstep Delivery</text>
    <text x="45" y="182" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Estimated arrival: Within 2 hours</text>
  </g>

  <!-- Interactive Slide-out Cart Drawer -->
  <g transform="translate(740, 40)" filter="url(#cart-shadow)">
    <rect x="0" y="0" width="410" height="670" rx="16" fill="#1C1C21" stroke="#2E2E36" stroke-width="1.5" />
    
    <text x="25" y="45" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900">Your Basket (3 items)</text>
    <text x="385" y="45" fill="#71717A" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="end">✕</text>
    <line x1="25" y1="65" x2="385" y2="65" stroke="#2A2A33" stroke-width="1" />

    <!-- Item 1 -->
    <rect x="25" y="80" width="360" height="90" rx="10" fill="#23232A" />
    <text x="40" y="110" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">A2 Gir Cow Bilona Ghee (1L)</text>
    <text x="40" y="130" fill="#71717A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Qty: 1 • Direct Vedic Farm Purity</text>
    <text x="40" y="152" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900">₹1,450</text>

    <!-- Item 2 -->
    <rect x="25" y="182" width="360" height="90" rx="10" fill="#23232A" />
    <text x="40" y="212" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Royal Basmati Biryani Rice (5kg)</text>
    <text x="40" y="232" fill="#71717A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Qty: 1 • 2-Year Aged Long Grain</text>
    <text x="40" y="254" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900">₹420</text>

    <!-- Item 3 -->
    <rect x="25" y="284" width="360" height="90" rx="10" fill="#23232A" />
    <text x="40" y="314" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Kachi Ghani Mustard Oil (1L)</text>
    <text x="40" y="334" fill="#71717A" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Qty: 2 • Unrefined Cold-Pressed</text>
    <text x="40" y="356" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900">₹470</text>

    <!-- Cart Summary -->
    <line x1="25" y1="395" x2="385" y2="395" stroke="#2A2A33" stroke-width="1" />
    <text x="25" y="425" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Subtotal</text>
    <text x="385" y="425" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="end">₹2,340</text>

    <text x="25" y="450" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">24-Hr Express Shipping</text>
    <text x="385" y="450" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="end">FREE</text>

    <text x="25" y="485" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900">Total Due</text>
    <text x="385" y="485" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="end">₹2,340</text>

    <rect x="25" y="520" width="360" height="48" rx="12" fill="url(#amber-accent2)" />
    <text x="205" y="550" fill="#09090B" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">Proceed to Secure Checkout →</text>
    
    <text x="205" y="595" fill="#71717A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" text-anchor="middle">Authenticated with Clerk • 256-Bit SSL Encryption</text>
  </g>
</svg>
