  </g>

  <text x="600" y="215" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" text-anchor="middle">Pure Kirana. <tspan fill="#F59E0B">Farm Fresh Daily.</tspan></text>
  <text x="600" y="250" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" text-anchor="middle">E-commerce web platform engineered for Manoj Traders with 24-hr express fulfillment and bilingual catalog</text>

