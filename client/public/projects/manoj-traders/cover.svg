    <rect x="26" y="26" width="95" height="22" rx="6" fill="#059669" />
    <text x="73" y="41" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">COLD-PRESSED</text>

    <text x="20" y="195" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">Kachi Ghani Mustard Oil</text>
