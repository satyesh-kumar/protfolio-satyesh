    <rect x="0" y="0" width="280" height="340" rx="18" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
    <rect x="16" y="16" width="248" height="150" rx="12" fill="#202024" />
    <circle cx="140" cy="91" r="42" fill="#F59E0B" fill-opacity="0.12" />
