    <text x="20" y="245" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900">₹235</text>
    <text x="75" y="245" fill="#52525B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" text-decoration="line-through">₹280</text>

    <rect x="20" y="270" width="240" height="42" rx="10" fill="#F59E0B" />
    <text x="140" y="296" fill="#09090B" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Add to Basket</text>
  </g>

  <!-- Engineering Attribution Stamp -->
  <text x="600" y="720" fill="#52525B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Engineered &amp; Delivered by Satyesh Kumar &amp; Shaswat Jaiswal for Manoj Traders • Production Deployment</text>
</svg>
