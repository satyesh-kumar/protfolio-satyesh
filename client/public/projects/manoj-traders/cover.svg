  <text x="440" y="75" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Home</text>
  <text x="510" y="75" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Grocery Aisles</text>
  <text x="635" y="75" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Orders</text>
  <text x="715" y="75" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Track Order</text>

  <!-- Lang Badge & Cart -->
  <rect x="835" y="54" width="60" height="32" rx="8" fill="#27272A" />
  <rect x="837" y="56" width="28" height="28" rx="6" fill="#F59E0B" />
  <text x="851" y="75" fill="#09090B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">EN</text>
  <text x="880" y="75" fill="#A1A1AA" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">हिंदी</text>

  <rect x="910" y="54" width="105" height="32" rx="10" fill="#F59E0B" />
  <text x="962" y="75" fill="#09090B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Cart (3 items)</text>

