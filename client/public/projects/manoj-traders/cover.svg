<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="mt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="amber-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#mt-bg)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="200" r="280" fill="#F59E0B" opacity="0.08" filter="blur(70px)" />
  <circle cx="1000" cy="500" r="320" fill="#10B981" opacity="0.07" filter="blur(80px)" />

  <!-- App Header Navbar -->
  <rect x="60" y="36" width="1080" height="68" rx="16" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
  
  <!-- Logo -->
  <rect x="84" y="52" width="36" height="36" rx="10" fill="url(#amber-gold)" />
  <text x="102" y="77" fill="#09090B" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" text-anchor="middle">M</text>
  
  <text x="132" y="68" fill="#FAFAFA" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" letter-spacing="1">MANOJ TRADERS</text>
  <text x="132" y="83" fill="#F59E0B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" letter-spacing="1.5">FRESH GROCERIES. TRUSTED QUALITY.</text>

