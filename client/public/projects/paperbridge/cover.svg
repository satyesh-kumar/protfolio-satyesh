<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="pb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0E0D" />
      <stop offset="50%" stop-color="#1A1614" />
      <stop offset="100%" stop-color="#241E1A" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#F3E5AB" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#pb-bg)" />
  
  <!-- Subtle Grid & Radial Glow -->
  <circle cx="600" cy="200" r="350" fill="#C5A059" opacity="0.08" filter="blur(60px)" />
  <circle cx="950" cy="550" r="280" fill="#8C6D3B" opacity="0.06" filter="blur(50px)" />

  <!-- App Header Bar -->
  <rect x="60" y="40" width="1080" height="64" rx="14" fill="#1C1816" stroke="#332A24" stroke-width="1.5" />
  <circle cx="96" cy="72" r="14" fill="url(#gold-grad)" />
  <text x="96" y="78" fill="#1A1614" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" text-anchor="middle">P</text>
  <text x="124" y="77" fill="#FAF8F5" font-family="'Playfair Display', serif" font-size="20" font-weight="700">PaperBridge</text>
  <rect x="250" y="58" width="130" height="28" rx="14" fill="#2E241E" />
  <text x="315" y="76" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">UNITED UNIVERSITY</text>

  <rect x="910" y="56" width="105" height="32" rx="8" fill="#2E241E" stroke="#4A3B30" stroke-width="1" />
  <text x="962" y="76" fill="#F5F2EC" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Upload PYQ</text>
  <rect x="1025" y="56" width="95" height="32" rx="8" fill="url(#gold-grad)" />
  <text x="1072" y="76" fill="#1A1614" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Sign In</text>

  <!-- Hero Headline & Description -->
  <text x="600" y="165" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" letter-spacing="3" text-anchor="middle">OFFICIAL ACADEMIC PYQ VAULT</text>
  <text x="600" y="215" fill="#FAF8F5" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="800" text-anchor="middle">Fast Access to Past Exam Papers</text>
  <text x="600" y="252" fill="#A89F91" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" text-anchor="middle">Centralized repository for United University engineering and management examination archives</text>

  <!-- Interactive Search Interface Box -->
  <g filter="url(#shadow)">
    <rect x="150" y="285" width="900" height="68" rx="18" fill="#181412" stroke="#3D322A" stroke-width="1.5" />
    <circle cx="192" cy="319" r="10" fill="none" stroke="#D4AF37" stroke-width="2.5" />
    <line x1="200" y1="326" x2="210" y2="336" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" />
    <text x="226" y="325" fill="#7A6F62" font-family="'Plus Jakarta Sans', sans-serif" font-size="15">Search by subject name, paper code (e.g. BCS501), semester, or department...</text>
    <rect x="915" y="297" width="120" height="44" rx="12" fill="url(#gold-grad)" />
    <text x="975" y="324" fill="#1A1614" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Find Papers</text>
  </g>

  <!-- Filter Pills Bar -->
  <g transform="translate(150, 375)">
    <rect x="0" y="0" width="84" height="32" rx="16" fill="url(#gold-grad)" />
    <text x="42" y="20" fill="#1A1614" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">All Years</text>
    
    <rect x="96" y="0" width="112" height="32" rx="16" fill="#1E1916" stroke="#3A2E26" stroke-width="1" />
    <text x="152" y="20" fill="#D5CBBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">2024–2025</text>

    <rect x="220" y="0" width="112" height="32" rx="16" fill="#1E1916" stroke="#3A2E26" stroke-width="1" />
    <text x="276" y="20" fill="#D5CBBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">2023–2024</text>

    <rect x="344" y="0" width="135" height="32" rx="16" fill="#1E1916" stroke="#3A2E26" stroke-width="1" />
    <text x="411" y="20" fill="#D5CBBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">B.Tech CSE</text>

    <rect x="491" y="0" width="125" height="32" rx="16" fill="#1E1916" stroke="#3A2E26" stroke-width="1" />
    <text x="553" y="20" fill="#D5CBBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Semester 5</text>

    <rect x="628" y="0" width="125" height="32" rx="16" fill="#1E1916" stroke="#3A2E26" stroke-width="1" />
    <text x="690" y="20" fill="#D5CBBF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Mid-Sem / End</text>
  </g>

  <!-- Paper Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(150, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="260" rx="16" fill="#191513" stroke="#382D25" stroke-width="1.5" />
    <rect x="18" y="18" width="60" height="24" rx="6" fill="#2B211A" />
    <text x="48" y="34" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">CSE-501</text>
    <rect x="86" y="18" width="55" height="24" rx="6" fill="#24211F" />
    <text x="113" y="34" fill="#A89F91" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">2024</text>
    
    <text x="18" y="80" fill="#FAF8F5" font-family="'Playfair Display', serif" font-size="17" font-weight="700">Database Management</text>
    <text x="18" y="102" fill="#FAF8F5" font-family="'Playfair Display', serif" font-size="17" font-weight="700">Systems (DBMS)</text>
    <text x="18" y="130" fill="#8A8073" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">End Semester Examination</text>
    <text x="18" y="150" fill="#8A8073" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">B.Tech Computer Science • Sem 5</text>

    <line x1="18" y1="180" x2="262" y2="180" stroke="#2B231E" stroke-width="1" />

    <rect x="18" y="198" width="115" height="38" rx="8" fill="#2A211B" stroke="#45352B" stroke-width="1" />
    <text x="75" y="222" fill="#FAF8F5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Preview PDF</text>
    <rect x="145" y="198" width="117" height="38" rx="8" fill="url(#gold-grad)" />
    <text x="203" y="222" fill="#1A1614" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Download</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(460, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="260" rx="16" fill="#191513" stroke="#382D25" stroke-width="1.5" />
    <rect x="18" y="18" width="60" height="24" rx="6" fill="#2B211A" />
    <text x="48" y="34" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">CSE-502</text>
    <rect x="86" y="18" width="55" height="24" rx="6" fill="#24211F" />
    <text x="113" y="34" fill="#A89F91" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">2024</text>
    
    <text x="18" y="80" fill="#FAF8F5" font-family="'Playfair Display', serif" font-size="17" font-weight="700">Design &amp; Analysis of</text>
    <text x="18" y="102" fill="#FAF8F5" font-family="'Playfair Display', serif" font-size="17" font-weight="700">Algorithms (DAA)</text>
    <text x="18" y="130" fill="#8A8073" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">End Semester Examination</text>
    <text x="18" y="150" fill="#8A8073" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">B.Tech Computer Science • Sem 5</text>

    <line x1="18" y1="180" x2="262" y2="180" stroke="#2B231E" stroke-width="1" />

    <rect x="18" y="198" width="115" height="38" rx="8" fill="#2A211B" stroke="#45352B" stroke-width="1" />
    <text x="75" y="222" fill="#FAF8F5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Preview PDF</text>
    <rect x="145" y="198" width="117" height="38" rx="8" fill="url(#gold-grad)" />
    <text x="203" y="222" fill="#1A1614" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Download</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(770, 430)" filter="url(#shadow)">
    <rect x="0" y="0" width="280" height="260" rx="16" fill="#191513" stroke="#382D25" stroke-width="1.5" />
    <rect x="18" y="18" width="60" height="24" rx="6" fill="#2B211A" />
    <text x="48" y="34" fill="#D4AF37" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle">CSE-503</text>
    <rect x="86" y="18" width="55" height="24" rx="6" fill="#24211F" />
    <text x="113" y="34" fill="#A89F91" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" text-anchor="middle">2023</text>
    
    <text x="18" y="80" fill="#FAF8F5" font-family="'Playfair Display', serif" font-size="17" font-weight="700">Operating Systems</text>
    <text x="18" y="102" fill="#FAF8F5" font-family="'Playfair Display', serif" font-size="17" font-weight="700">&amp; System Internals</text>
    <text x="18" y="130" fill="#8A8073" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">End Semester Examination</text>
    <text x="18" y="150" fill="#8A8073" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">B.Tech Computer Science • Sem 5</text>

    <line x1="18" y1="180" x2="262" y2="180" stroke="#2B231E" stroke-width="1" />

    <rect x="18" y="198" width="115" height="38" rx="8" fill="#2A211B" stroke="#45352B" stroke-width="1" />
    <text x="75" y="222" fill="#FAF8F5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Preview PDF</text>
    <rect x="145" y="198" width="117" height="38" rx="8" fill="url(#gold-grad)" />
    <text x="203" y="222" fill="#1A1614" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">Download</text>
  </g>
</svg>
